# NetPulse CI build + SignPath Foundation code signing
#
# SignPath signs artifacts produced by a verified CI run ("origin verification"),
# NOT locally-built binaries. This workflow is what makes the project eligible.
#
# One-time setup after your SignPath Foundation application is approved:
#   1. In SignPath, note your Organization ID, create a Project (slug below),
#      an Artifact Configuration, and a Signing Policy (e.g. "release-signing").
#   2. Add repo secret  SIGNPATH_API_TOKEN  (Settings > Secrets > Actions).
#   3. Replace the three TODO placeholder values in the "sign" job below.
#
# Trigger: push a version tag (e.g. v0.2.0) or run manually.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release and upload assets
  id-token: write   # OIDC token used by SignPath origin verification

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT: src/NetPulse/NetPulse.csproj

jobs:
  build:
    name: Build unsigned EXEs
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore NetPulse.sln

      - name: Test
        run: dotnet test NetPulse.sln -c Release --no-restore --nologo

      - name: Publish win-x64
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -p:DebugType=embedded
          -o publish/win-x64

      - name: Publish win-arm64
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release -r win-arm64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -p:DebugType=embedded
          -o publish/win-arm64

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/win-x64/NetPulse.exe   dist/NetPulse-win-x64.exe
          Copy-Item publish/win-arm64/NetPulse.exe dist/NetPulse-win-arm64.exe

      - name: Upload unsigned artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: netpulse-unsigned
          path: dist/*.exe
          if-no-files-found: error

  sign:
    name: Sign with SignPath Foundation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          # TODO: replace the three values below with your SignPath details.
          organization-id: 'REPLACE_WITH_SIGNPATH_ORGANIZATION_ID'
          project-slug: 'NetPulse'
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'signed'

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd signed
          for f in *.exe; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Attach signed binaries to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            signed/*.exe
            signed/*.sha256
          generate_release_notes: true
